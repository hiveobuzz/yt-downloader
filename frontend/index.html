<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YouTube Stream Extractor & Muxing Tool — yt-dlp + FFmpeg power-user utility with real-time download telemetry and multi-audio track selection.">
  <title>YT Stream Extractor &amp; Muxer (yt-dlp + FFmpeg)</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Original Industrial Workstation CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            app: '#0B0D0C',
            surface: '#121514',
            raised: '#181C1A',
            active: '#1F2421',
            terminal: '#070908',
            accent: '#E8B93A',
            'accent-hover': '#F7CA4F',
            'border-hairline': '#252B28',
            'border-subtle': '#1E2320',
            'border-active': '#3E4743',
            'status-green': '#3ECF4A',
            'status-red': '#E54D42'
          },
          fontFamily: {
            mono: ['"JetBrains Mono"', 'Consolas', 'monospace'],
            sans: ['"Space Grotesk"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <!-- Mount Point for React App -->
  <div id="root" style="width: 100%; display: flex; justify-content: center;"></div>

  <!-- React 18 Main Code -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
